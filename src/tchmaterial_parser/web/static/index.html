<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>国家中小学智慧教育平台 资源下载工具</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <!-- 侧边栏：与 StreamCap 一致，图标 + 文字导航，底部放主题开关 -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">📚</span>
      <div class="brand-text">
        <strong>教材下载</strong>
        <small>智慧教育平台</small>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="library" type="button">
        <span class="nav-icon">🏠</span><span>教材库</span>
      </button>
      <button class="nav-item" data-view="browse" type="button">
        <span class="nav-icon">🧭</span><span>浏览资源</span>
      </button>
      <button class="nav-item" data-view="tasks" type="button">
        <span class="nav-icon">📥</span><span>下载任务</span>
        <span class="badge" id="task-badge" hidden>0</span>
      </button>
      <button class="nav-item" data-view="records" type="button">
        <span class="nav-icon">🗂️</span><span>下载记录</span>
      </button>
      <button class="nav-item" data-view="settings" type="button">
        <span class="nav-icon">⚙️</span><span>设置</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item" id="theme-toggle" type="button">
        <span class="nav-icon" id="theme-icon">🌙</span><span id="theme-label">深色模式</span>
      </button>
      <div class="side-meta" id="side-meta">加载中…</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">教材库</h1>
        <p id="view-subtitle">已下载的电子课本，点击卡片即可下载</p>
      </div>
      <div class="topbar-actions">
        <div class="search-field">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="search-input" type="search" placeholder="搜索教材…" autocomplete="off">
        </div>
        <button class="icon-btn" id="refresh-btn" type="button" title="刷新">⟳</button>
      </div>
    </header>

    <div class="view-root" id="view-root"></div>
    <footer class="statusbar">
      <span id="status-text">就绪</span>
      <span id="status-right"></span>
    </footer>
  </main>
</div>

<div class="toast-stack" id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
