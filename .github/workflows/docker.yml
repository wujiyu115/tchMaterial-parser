name: docker

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements-web.txt"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  # 仓库名含大写字母，而 GHCR 要求全小写，因此镜像名单独指定
  IMAGE: ghcr.io/wujiyu115/tchmaterial-parser-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 单平台构建并加载到本地，用于下面的冒烟测试，避免重复构建
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tchmaterial-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name tchmaterial-test -p 18080:8080 tchmaterial-web:test
          trap 'docker logs tchmaterial-test; docker rm -f tchmaterial-test' EXIT

          # 等待服务就绪，最多 60 秒
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health > /dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:18080/api/stats | grep -q '"library_count"'
          # 前端页面与静态资源必须可用（验证 package-data 与 COPY 是否正确）
          curl -fsS http://127.0.0.1:18080/ | grep -q '国家中小学智慧教育平台'
          curl -fsS http://127.0.0.1:18080/static/app.js > /dev/null
          # 教材目录能从平台拉取（网络不通时仅告警，不阻断发布）
          curl -fsS 'http://127.0.0.1:18080/api/catalog/children?path=' > /dev/null \
            || echo "::warning::catalog 拉取失败，可能是平台网络受限"

          # 验证数据目录写入（挂载点行为）
          docker exec tchmaterial-test sh -c 'test -d /data/downloads'
          echo "smoke test passed"

      - name: Build and push multi-arch
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}:${GITHUB_SHA}\`"
            echo ""
            echo "Unraid 拉取命令：\`docker pull ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
